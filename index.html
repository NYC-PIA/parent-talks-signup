<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parent Talk Facilitation Tracker</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; font-size: 15px; color: #202124;
         margin: 0; padding: 16px; background: #fff; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .welcome { margin: 0 0 16px; }
  .hello { font-size: 17px; font-weight: bold; margin: 0 0 6px; }
  .hello:empty { display: none; }
  .intro { color: #5f6368; font-size: 14px; margin: 0 0 12px; }
  h2 { font-size: 16px; margin: 28px 0 10px; padding-bottom: 6px;
       border-bottom: 1px solid #e0e0e0; }
  .talk { border: 1px solid #dadce0; border-radius: 6px; padding: 12px 14px;
          margin-bottom: 10px; }
  .talk .who { font-weight: bold; }
  .talk .when { color: #444; margin-top: 2px; }
  .talk .meta { color: #5f6368; font-size: 13px; margin-top: 4px; }
  .actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  button { padding: 8px 14px; font-size: 14px; border-radius: 4px;
           border: 1px solid #c0c0c0; background: #fff; cursor: pointer; }
  button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  button.quiet { color: #b00020; border-color: #e0b4bc; }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible { outline: 2px solid #1a73e8; outline-offset: 2px; }
  .mine { background: #f1f8f1; border-color: #c5e0c5; }
  .pendingcard { background: #fffbf0; border-color: #e8d9a8; }
  .tag { font-size: 11px; font-weight: bold; text-transform: uppercase;
         letter-spacing: 0.04em; padding: 2px 7px; border-radius: 10px;
         margin-left: 6px; vertical-align: middle; }
  .tag.confirmed { background: #d9ead3; color: #274e13; }
  .tag.pending { background: #fce5cd; color: #7f4f24; }
  .mynote { margin: 0 0 10px; }
  .meta a { color: #1a73e8; }
  .empty { color: #5f6368; font-style: italic; }
  #msg { padding: 10px 12px; border-radius: 4px; margin-bottom: 16px; display: none;
         white-space: pre-line; }
  #msg.ok { display: block; background: #d9ead3; }
  #msg.err { display: block; background: #f4c7c3; }
  .loading { color: #5f6368; }
  .tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.open { border-collapse: collapse; width: 100%; font-size: 14px; }
  table.open th, table.open td { border: 1px solid #9aa0a6; padding: 7px 8px;
                                 text-align: center; white-space: nowrap; }
  table.open th { background: #5b9be6; font-weight: bold; }
  table.open tbody tr:nth-child(even) { background: #f1f3f8; }
  table.open tbody tr { cursor: pointer; }
  table.open tbody tr.picked { background: #fff2cc; }
  table.open input { width: 18px; height: 18px; cursor: pointer; }
  .confirmbar { margin-top: 12px; display: flex; align-items: center; gap: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <p id="hello" class="hello"></p>
  <h1 id="title">Parent Talk Facilitation Tracker</h1>
  <p class="welcome" id="welcome">Thank you for signing up to facilitate Parent Talks with
    NYC-PIA. Below is a list of your current assignments as well as Talks that are open
    for signup. Please select as many as you would like!</p>

  <div id="msg"></div>
  <p id="loading" class="loading">Loading...</p>

  <div id="main" style="display:none;">

    <h2>Open for signup</h2>
    <p class="intro" id="intro"></p>
    <div id="open"></div>

    <h2>My talks</h2>
    <div id="mine"></div>
  </div>
</div>

<script>
  // The Apps Script web app's /exec URL (Deploy > Manage deployments).
  // Keep it in step with FS_CONFIG_.webAppUrl in Facilitator Signup.gs.
  var API_URL = 'https://script.google.com/macros/s/AKfycbzheOIYb7BM8bVNinTpwLvedpYSZOBMKICaxkBG7jCdzGPVsYLw9XGRF26LHwoOiOBL7g/exec';

  var UNKNOWN_LINK =
    "This link isn't recognised. It may have been reissued - check the most " +
    'recent email, or contact NYC-Parents in Action for a new one.';

  function readToken() {
    var q = new URLSearchParams(window.location.search).get('t');
    if (q) return q.trim();
    var h = new URLSearchParams(window.location.hash.replace(/^#/, '')).get('t');
    return h ? h.trim() : '';
  }

  var TOKEN = readToken();
  var RELEASE_CONTACT = 'NYC-Parents in Action';
  var busy = false;

  // Every call goes out with no cookies, so whichever Google accounts
  // the browser is signed into never come into it.
  function api(method, payload) {
    var url = API_URL;
    var opts = { method: method, credentials: 'omit', redirect: 'follow', cache: 'no-store' };
    if (method === 'GET') {
      url += (url.indexOf('?') === -1 ? '?' : '&') +
             'action=data&t=' + encodeURIComponent(TOKEN) + '&_=' + Date.now();
    } else {
      // text/plain keeps this a simple request the script can answer.
      opts.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
      opts.body = JSON.stringify(payload);
    }
    return fetch(url, opts).then(function (r) {
      if (!r.ok) throw new Error('the server returned ' + r.status);
      return r.json();
    });
  }

  function show(text, ok) {
    var m = document.getElementById('msg');
    m.textContent = text;
    m.className = ok ? 'ok' : 'err';
    window.scrollTo(0, 0);
  }

  function clearMsg() {
    var m = document.getElementById('msg');
    m.textContent = '';
    m.className = '';
  }

  function doneLoading() {
    document.getElementById('loading').style.display = 'none';
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // The last page this link saw is kept in this browser, so a return
  // visit shows it at once while the fresh copy loads. Buttons stay
  // off until the fresh copy arrives, so nobody acts on old data.
  var CACHE_KEY = 'pt-signup:' + TOKEN;

  function readCache() {
    try {
      var s = localStorage.getItem(CACHE_KEY);
      return s ? JSON.parse(s) : null;
    } catch (e) { return null; }
  }

  function saveCache(d) {
    try {
      if (d && d.ok === 'true') localStorage.setItem(CACHE_KEY, JSON.stringify(d));
      else localStorage.removeItem(CACHE_KEY);
    } catch (e) {}
  }

  function showChecking() {
    var l = document.getElementById('loading');
    l.textContent = 'Checking for the latest...';
    l.style.display = 'block';
    var bs = document.querySelectorAll('button, table.open input');
    for (var i = 0; i < bs.length; i++) bs[i].disabled = true;
  }

  // One person and how to reach them: name, then email and phone as
  // links that open mail or dial on a phone.
  function personLine(label, p) {
    var bits = [esc(p.name)];
    if (p.email) bits.push('<a href="mailto:' + esc(p.email) + '">' + esc(p.email) + '</a>');
    if (p.phone) bits.push('<a href="tel:' + esc(String(p.phone).replace(/[^0-9+]/g, '')) +
                           '">' + esc(p.phone) + '</a>');
    return '<div class="meta">' + label + ': ' + bits.join(' &middot; ') + '</div>';
  }

  function load() {
    api('GET')
      .then(function (d) { saveCache(d); render(d); })
      .catch(function (e) { doneLoading(); show('Could not load: ' + e.message, false); });
  }

  function render(d) {
    doneLoading();
    if (d && d.title) {
      document.getElementById('title').textContent = d.title;
      document.title = d.title;
    }
    if (d && d.welcome) document.getElementById('welcome').textContent = d.welcome;
    if (d && d.intro) document.getElementById('intro').textContent = d.intro;
    if (d && d.releaseContact) RELEASE_CONTACT = d.releaseContact;

    if (!d || d.ok !== 'true') {
      document.getElementById('main').style.display = 'none';
      if (d && d.error === 'unknown link') show(UNKNOWN_LINK, false);
      else show('Could not load: ' + ((d && d.error) || 'unknown error'), false);
      return;
    }

    document.getElementById('hello').textContent = 'Hello, ' + d.name + '.';
    document.getElementById('main').style.display = 'block';

    var mineEl = document.getElementById('mine');
    if (!d.mine.length) {
      mineEl.innerHTML = '<p class="empty">You have not put your name down for anything yet.</p>';
    } else {
      var anyConfirmed = d.mine.some(function (t) { return t.confirmed === 'true'; });
      mineEl.innerHTML = (anyConfirmed
        ? '<p class="mynote"><strong>Confirmed Parent Talks</strong></p>'
        : '') + d.mine.map(function (t) {
        var isConfirmed = t.confirmed === 'true';
        var badge = isConfirmed
          ? '<span class="tag confirmed">Confirmed</span>'
          : '<span class="tag pending">Volunteered</span>';
        var note = isConfirmed
          ? ''
          : 'Your name is down. You are not on the talk yet - ' + esc(RELEASE_CONTACT) +
            ' confirms the facilitators and will be in touch. Please hold the date ' +
            'in the meantime.';
        var people = '';
        if (isConfirmed) {
          var partners = t.partners || [];
          var contacts = t.contacts || [];
          people = '<div class="meta">You: ' + esc(t.roles.join(', ')) + '</div>' +
            (partners.length
              ? partners.map(function (p) { return personLine('Co-facilitator', p); }).join('')
              : '<div class="meta">Co-facilitator: still needed</div>') +
            (contacts.length
              ? contacts.map(function (c) { return personLine('Parent Talk contact', c); }).join('')
              : '<div class="meta">Parent Talk contact: not yet assigned</div>');
        }
        return '<div class="talk ' + (isConfirmed ? 'mine' : 'pendingcard') + '">' +
          '<div class="who">' + esc(t.label) + ' ' + badge + '</div>' +
          '<div class="when">' + esc(t.when) + '</div>' +
          (t.location ? '<div class="meta">' + esc(t.location) + '</div>' : '') +
          (note ? '<div class="meta">' + note + '</div>' : '') +
          people +
        '</div>';
      }).join('');
    }

    var openEl = document.getElementById('open');
    if (!d.open.length) {
      openEl.innerHTML = '<p class="empty">Nothing is open for signup right now. ' +
                         'Thank you - check back another time.</p>';
    } else {
      openEl.innerHTML =
        '<div class="tablewrap"><table class="open">' +
          '<thead><tr><th>Select</th><th>Date</th><th>Day</th><th>Time</th>' +
          '<th>Grade</th><th>Location</th></tr></thead><tbody>' +
          d.open.map(function (t) {
            return '<tr data-row="' + esc(t.eventId) + '">' +
              '<td><input type="checkbox" value="' + esc(t.eventId) + '" ' +
                'aria-label="Select ' + esc(t.label) + '"></td>' +
              '<td>' + esc(t.date || '') + '</td>' +
              '<td>' + esc(t.day || '') + '</td>' +
              '<td>' + esc(t.time || 'TBD') + '</td>' +
              '<td>' + esc(t.label) + '</td>' +
              '<td>' + esc(t.location || '') + '</td>' +
            '</tr>';
          }).join('') +
        '</tbody></table></div>' +
        '<div class="confirmbar">' +
          '<button class="primary" id="confirmBtn" disabled>Confirm</button>' +
          '<span id="pickCount" class="meta"></span>' +
        '</div>';
      updatePicked();
    }
  }

  // A signup or release answers with the refreshed page, so it is drawn
  // straight from the reply. Only an older script without that falls
  // back to asking again.
  function redraw(r) {
    if (r && r.page) { saveCache(r.page); render(r.page); }
    else load();
  }

  function setBusy(on) {
    busy = on;
    var bs = document.querySelectorAll('button, table.open input');
    for (var i = 0; i < bs.length; i++) bs[i].disabled = on;
  }

  function pickedIds() {
    var boxes = document.querySelectorAll('table.open input[type=checkbox]');
    var ids = [];
    for (var i = 0; i < boxes.length; i++) {
      var row = boxes[i].closest('tr');
      if (row) row.className = boxes[i].checked ? 'picked' : '';
      if (boxes[i].checked) ids.push(boxes[i].value);
    }
    return ids;
  }

  function updatePicked() {
    var n = pickedIds().length;
    var btn = document.getElementById('confirmBtn');
    if (btn) btn.disabled = busy || n === 0;
    var c = document.getElementById('pickCount');
    if (c) c.textContent = n ? n + ' selected' : 'Tick the talks you can cover, then Confirm.';
  }

  function confirmPicked() {
    if (busy) return;
    var ids = pickedIds();
    if (!ids.length) return;
    clearMsg();
    setBusy(true);
    api('POST', { action: 'claimMany', t: TOKEN, eventIds: ids })
      .then(function (r) {
        setBusy(false);
        var done = parseInt(r.claimed || '0', 10);
        var lines = [];
        if (done) {
          lines.push('Thank you - your name is down for ' + done + ' talk' +
            (done === 1 ? '' : 's') + '. ' + RELEASE_CONTACT + ' confirms the ' +
            'facilitators, so please hold the date' + (done === 1 ? '' : 's') +
            ' until you hear back.');
        }
        if (r.errors && r.errors.length) {
          lines.push((done ? 'Not signed up:\n' : '') + r.errors.join('\n'));
        } else if (!done && r.error) {
          lines.push(r.error);
        }
        show(lines.join('\n\n'), done > 0 && !(r.errors && r.errors.length));
        redraw(r);
      })
      .catch(function (e) { setBusy(false); updatePicked(); show('Failed: ' + e.message, false); });
  }

  // One listener for every button, so event IDs never need quoting
  // inside onclick attributes.
  document.addEventListener('click', function (ev) {
    if (!ev.target.closest) return;
    var b = ev.target.closest('button');
    if (b) {
      if (!b.disabled && b.id === 'confirmBtn') confirmPicked();
      return;
    }
    // A click anywhere on a row ticks its box, which is easier on a phone.
    var row = ev.target.closest('table.open tbody tr');
    if (!row) return;
    var box = row.querySelector('input[type=checkbox]');
    if (!box || box.disabled) return;
    if (ev.target !== box) box.checked = !box.checked;
    updatePicked();
  });

  if (TOKEN) {
    var cached = readCache();
    if (cached) { render(cached); showChecking(); }
    load();
  } else {
    doneLoading();
    show(UNKNOWN_LINK, false);
  }
</script>
</body>
</html>
