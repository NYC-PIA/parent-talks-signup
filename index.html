<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parent Talk Facilitation Tracker</title>
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="https://nyc-pia.github.io/parent-talks-signup/apple-touch-icon.png?v=2">
<style>
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 15px; color: #202124;
         margin: 0; padding: 16px; background: #fff; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .welcome { margin: 0 0 16px; }
  .hello { font-size: 17px; font-weight: bold; margin: 0 0 6px; }
  .hello:empty { display: none; }
  .intro { color: #5f6368; font-size: 14px; margin: 0 0 12px; }
  h2 { font-size: 16px; margin: 28px 0 10px; padding-bottom: 6px;
       border-bottom: 1px solid #e0e0e0; }
  .talk { border: 1px solid #dadce0; border-radius: 6px; padding: 12px 14px;
          margin-bottom: 10px; }
  .talk .who { font-weight: bold; }
  .talk .when { color: #444; margin-top: 2px; }
  .talk .meta { color: #5f6368; font-size: 13px; margin-top: 4px; }
  .actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  button { padding: 8px 14px; font-size: 14px; border-radius: 4px;
           border: 1px solid #c0c0c0; background: #fff; cursor: pointer; }
  button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  button.quiet { color: #b00020; border-color: #e0b4bc; }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible { outline: 2px solid #1a73e8; outline-offset: 2px; }
  .mine { background: #f1f8f1; border-color: #c5e0c5; }
  details.completed { margin-top: 16px; }
  details.completed summary { cursor: pointer; font-weight: 600; margin-bottom: 8px; }
  .pendingcard { background: #fffbf0; border-color: #e8d9a8; }
  .tag { font-size: 11px; font-weight: bold; text-transform: uppercase;
         letter-spacing: 0.04em; padding: 2px 7px; border-radius: 10px;
         margin-left: 6px; vertical-align: middle; }
  .tag.confirmed { background: #d9ead3; color: #274e13; }
  .tag.pending { background: #fce5cd; color: #7f4f24; }
  .mynote { margin: 0 0 10px; }
  .meta a { color: #1a73e8; }
  .empty { color: #5f6368; font-style: italic; }
  #msg { padding: 10px 12px; border-radius: 4px; margin-bottom: 16px; display: none;
         white-space: pre-line; }
  #msg.ok { display: block; background: #d9ead3; }
  #msg.err { display: block; background: #f4c7c3; }
  .loading { color: #5f6368; }
  .tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.open { border-collapse: collapse; width: 100%; font-size: 14px; }
  table.open th, table.open td { border: 1px solid #9aa0a6; padding: 7px 8px;
                                 text-align: center; white-space: nowrap; }
  table.open th { background: #5b9be6; font-weight: bold; }
  table.open tbody tr:nth-child(even) { background: #f1f3f8; }
  table.open tbody tr { cursor: pointer; }
  table.open tbody tr.picked { background: #fff2cc; }
  table.open input { width: 18px; height: 18px; cursor: pointer; }
  table.open th:nth-child(6), table.open td:nth-child(6),
  table.open th:nth-child(7), table.open td:nth-child(7) { text-align: left; }
  table.open td:nth-child(6) { white-space: normal; min-width: 160px; font-style: italic; }
  .confirmbar { margin-top: 12px; display: flex; align-items: center; gap: 12px; }
  .picker { border: 1px solid #dadce0; border-radius: 6px; padding: 16px; max-width: 420px; }
  .picker label { display: block; font-weight: bold; margin: 12px 0 6px; }
  .picker label:first-child { margin-top: 0; }
  .picker select, .picker input { width: 100%; box-sizing: border-box; padding: 9px 10px;
                                  font-size: 16px; border: 1px solid #c0c0c0; border-radius: 4px;
                                  background: #fff; }

  /* Phones (narrower than 600px): each open talk becomes a stacked card,
     checkbox on the left, grade on top, then date, day, time and location. */
  @media (max-width: 600px) {
    .tablewrap { overflow-x: visible; }
    table.open, table.open tbody { display: block; width: 100%; }
    table.open thead { display: none; }
    table.open tbody tr { display: grid; grid-template-columns: 34px 1fr;
                          column-gap: 8px; border: 1px solid #9aa0a6; border-radius: 6px;
                          padding: 10px 12px; margin-bottom: 8px; background: #fff; }
    table.open tbody tr:nth-child(even) { background: #f1f3f8; }
    table.open tbody tr.picked { background: #fff2cc; border-color: #e0c060; }
    table.open td { display: block; border: 0; padding: 1px 0; text-align: left;
                    white-space: normal; grid-column: 2; }
    table.open td:nth-child(1) { grid-column: 1; grid-row: 1 / span 6; align-self: center; }
    table.open td:nth-child(5) { grid-row: 1; font-weight: bold; font-size: 15px; }
    table.open td:nth-child(2) { grid-row: 2; }
    table.open td:nth-child(3) { grid-row: 3; }
    table.open td:nth-child(4) { grid-row: 4; }
    table.open td:nth-child(6) { grid-row: 5; min-width: 0; }
    table.open td:nth-child(7) { grid-row: 6; }
    table.open td:nth-child(n+2):not(:nth-child(5))::before {
      content: attr(data-label) ": "; color: #5f6368; font-style: normal; }
    table.open td:nth-child(6):empty, table.open td:nth-child(7):empty { display: none; }
    table.open input { width: 22px; height: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p id="hello" class="hello"></p>
  <h1 id="title">Parent Talk Facilitation Tracker</h1>
  <p class="welcome" id="welcome">Thank you for signing up to facilitate Parent Talks with
    NYC-PIA. Below is a list of your current assignments as well as Talks that are open
    for signup. Please select as many as you would like!</p>

  <div id="msg"></div>
  <p id="loading" class="loading">Loading...</p>

  <div id="main" style="display:none;">

    <div id="picker" class="picker" style="display:none;">
      <label for="pickName">Select your name</label>
      <select id="pickName"><option value="">Loading names...</option></select>
      <label for="pickEmail">Your email address</label>
      <input type="email" id="pickEmail" autocomplete="email" maxlength="200">
    </div>

    <h2>Open for signup</h2>
    <p class="intro" id="intro"></p>
    <div id="open"></div>

    <div id="mineSection">
      <h2>My talks</h2>
      <div id="mine"></div>
    </div>
  </div>
</div>

<script>
  // The Apps Script web app's /exec URL (Deploy > Manage deployments).
  // Keep it in step with FS_CONFIG_.webAppUrl in Facilitator Signup.gs.
  var API_URL = 'https://script.google.com/macros/s/AKfycbzheOIYb7BM8bVNinTpwLvedpYSZOBMKICaxkBG7jCdzGPVsYLw9XGRF26LHwoOiOBL7g/exec';

  var UNKNOWN_LINK =
    "This link isn't recognised. It may have been reissued - check the most " +
    'recent email, or contact NYC-Parents in Action for a new one.';

  function readToken() {
    var q = new URLSearchParams(window.location.search).get('t');
    if (q) return q.trim();
    var h = new URLSearchParams(window.location.hash.replace(/^#/, '')).get('t');
    return h ? h.trim() : '';
  }

  // A personal link carries ?t= and shows "My talks". The general link
  // has none: it shows only the open talks, and the facilitator picks
  // their name and enters their email to sign up.
  var TOKEN = readToken();
  var GENERAL = !TOKEN;
  var GENERAL_WELCOME = 'Thank you for facilitating Parent Talks with NYC-PIA. Below are ' +
    'the Talks that are open for signup. Select your name, enter your email, and choose ' +
    'as many as you would like!';
  var RELEASE_CONTACT = 'NYC-Parents in Action';
  var busy = false;

  // Every call goes out with no cookies, so whichever Google accounts
  // the browser is signed into never come into it.
  function api(method, payload) {
    var url = API_URL;
    var opts = { method: method, credentials: 'omit', redirect: 'follow', cache: 'no-store' };
    if (method === 'GET') {
      url += (url.indexOf('?') === -1 ? '?' : '&') +
             'action=data&t=' + encodeURIComponent(TOKEN) + '&_=' + Date.now();
    } else {
      // text/plain keeps this a simple request the script can answer.
      opts.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
      opts.body = JSON.stringify(payload);
    }
    return fetch(url, opts).then(function (r) {
      if (!r.ok) throw new Error('the server returned ' + r.status);
      return r.json();
    });
  }

  function show(text, ok) {
    var m = document.getElementById('msg');
    m.textContent = text;
    m.className = ok ? 'ok' : 'err';
    window.scrollTo(0, 0);
  }

  function clearMsg() {
    var m = document.getElementById('msg');
    m.textContent = '';
    m.className = '';
  }

  function doneLoading() {
    document.getElementById('loading').style.display = 'none';
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Shortens an address for display: drops the country, the ZIP code and
  // "New York, NY", but keeps any other town, e.g. "Bronx, NY" or "Riverdale, NY".
  function shortLoc(s) {
    return String(s == null ? '' : s)
      .replace(/[,\s]*\b(USA|U\.S\.A\.|United States( of America)?)\b\.?/gi, '')
      .replace(/\b(NY|N\.Y\.|New York)\b[,\s]*\d{5}(-\d{4})?\b/gi, '$1')
      .replace(/[,\s]+\d{5}(-\d{4})?\s*$/, '')
      .replace(/[,\s]*\b(New York City|New York|NYC|Manhattan|NY)\s*,?\s*(NY|N\.Y\.|New York)\b\.?/gi, '')
      .replace(/\s*,\s*(,\s*)+/g, ', ')
      .replace(/^[\s,]+|[\s,]+$/g, '');
  }

  // The last page this link saw is kept in this browser, so a return
  // visit shows it at once while the fresh copy loads. Buttons stay
  // off until the fresh copy arrives, so nobody acts on old data.
  function cacheKey() { return 'pt-signup:' + TOKEN; }

  function readCache() {
    try {
      var s = localStorage.getItem(cacheKey());
      return s ? JSON.parse(s) : null;
    } catch (e) { return null; }
  }

  function saveCache(d) {
    try {
      if (d && d.ok === 'true') localStorage.setItem(cacheKey(), JSON.stringify(d));
      else localStorage.removeItem(cacheKey());
    } catch (e) {}
  }

  function showChecking() {
    var l = document.getElementById('loading');
    l.textContent = 'Checking for the latest...';
    l.style.display = 'block';
    var bs = document.querySelectorAll('button, table.open input');
    for (var i = 0; i < bs.length; i++) bs[i].disabled = true;
  }

  // One person and how to reach them: name, then email and phone as
  // links that open mail or dial on a phone.
  function personLine(label, p) {
    var bits = [esc(p.name)];
    if (p.email) bits.push('<a href="mailto:' + esc(p.email) + '">' + esc(p.email) + '</a>');
    if (p.phone) bits.push('<a href="tel:' + esc(String(p.phone).replace(/[^0-9+]/g, '')) +
                           '">' + esc(p.phone) + '</a>');
    return '<div class="meta">' + label + ': ' + bits.join(' &middot; ') + '</div>';
  }

  // Role names as the confirmations use them: the Facilitator role is
  // shown as Co-facilitator, never as plain "Facilitator".
  function roleLabel(role) {
    return role === 'Facilitator' ? 'Co-facilitator' : String(role || '');
  }

  function load() {
    api('GET')
      .then(function (d) { saveCache(d); render(d); })
      .catch(function (e) { doneLoading(); show('Could not load: ' + e.message, false); });
  }

  function render(d) {
    doneLoading();
    if (d && d.title) {
      document.getElementById('title').textContent = d.title;
      document.title = d.title;
    }
    if (d && d.welcome) document.getElementById('welcome').textContent = d.welcome;
    if (d && d.intro) document.getElementById('intro').textContent = d.intro;
    if (d && d.releaseContact) RELEASE_CONTACT = d.releaseContact;

    if (!d || d.ok !== 'true') {
      document.getElementById('main').style.display = 'none';
      if (d && d.error === 'unknown link') show(UNKNOWN_LINK, false);
      else show('Could not load: ' + ((d && d.error) || 'unknown error'), false);
      return;
    }

    document.getElementById('hello').textContent = 'Hello, ' + d.name + '.';
    document.getElementById('main').style.display = 'block';

    var mineEl = document.getElementById('mine');
    // A volunteered talk drops off once staffing is turned off for it.
    var mineList = d.mine.filter(function (t) {
      return t.confirmed === 'true' || t.staffing !== 'false';
    });
    var completed = d.completed || [];
    if (!mineList.length) {
      mineEl.innerHTML = '<p class="empty">You have not put your name down for anything yet.</p>';
    } else {
      var anyConfirmed = mineList.some(function (t) { return t.confirmed === 'true'; });
      mineEl.innerHTML = (anyConfirmed
        ? '<p class="mynote"><strong>Confirmed Parent Talks</strong></p>'
        : '') + mineList.map(function (t) {
        var isConfirmed = t.confirmed === 'true';
        var badge = isConfirmed
          ? '<span class="tag confirmed">Confirmed</span>'
          : '<span class="tag pending">Volunteered</span>';
        var note = isConfirmed
          ? ''
          : 'Your name is down. You are not on the talk yet - ' + esc(RELEASE_CONTACT) +
            ' confirms the facilitators and will be in touch. Please hold the date ' +
            'in the meantime.';
        var people = '';
        if (isConfirmed) {
          var partners = t.partners || [];
          var contacts = t.contacts || [];
          people = '<div class="meta">You: ' + esc(t.roles.map(roleLabel).join(', ')) + '</div>' +
            (partners.length
              ? partners.map(function (p) {
                  // The partner's own role; an older script without it means
                  // the partner holds whichever role you do not.
                  var r = p.role || (t.roles.indexOf('Logistical Facilitator') !== -1
                    ? 'Facilitator' : 'Logistical Facilitator');
                  return personLine(roleLabel(r), p);
                }).join('')
              : '<div class="meta">Co-facilitator: still needed</div>') +
            (contacts.length
              ? contacts.map(function (c) { return personLine('Parent Talk contact', c); }).join('')
              : '<div class="meta">Parent Talk contact: not yet assigned</div>');
        }
        return '<div class="talk ' + (isConfirmed ? 'mine' : 'pendingcard') + '">' +
          '<div class="who">' + esc(t.label) + ' ' + badge + '</div>' +
          '<div class="when">' + esc(t.when) + '</div>' +
          (t.location ? '<div class="meta">' + esc(shortLoc(t.location)) + '</div>' : '') +
          (note ? '<div class="meta">' + note + '</div>' : '') +
          people +
        '</div>';
      }).join('');
    }

    // Past Parent Talks: confirmed talks already held, collapsed at the bottom.
    if (completed.length) {
      mineEl.innerHTML +=
        '<details class="completed"><summary>Past Parent Talks (' +
          completed.length + ')</summary>' +
        completed.map(function (t) {
          return '<div class="talk mine">' +
            '<div class="who">' + esc(t.label) + '</div>' +
            '<div class="when">' + esc(t.when) + '</div>' +
            (t.roles && t.roles.length
              ? '<div class="meta">You: ' + esc(t.roles.map(roleLabel).join(', ')) + '</div>' : '') +
          '</div>';
        }).join('') +
        '</details>';
    }

    renderOpen(d.open);
  }

  function renderOpen(list) {
    var openEl = document.getElementById('open');
    if (!list.length) {
      openEl.innerHTML = '<p class="empty">Nothing is open for signup right now. ' +
                         'Thank you - check back another time.</p>';
    } else {
      openEl.innerHTML =
        '<div class="tablewrap"><table class="open">' +
          '<thead><tr><th>Select</th><th>Date</th><th>Day</th><th>Time</th>' +
          '<th>Grade</th><th>Notes</th><th>Location</th></tr></thead><tbody>' +
          list.map(function (t) {
            return '<tr data-row="' + esc(t.eventId) + '">' +
              '<td><input type="checkbox" value="' + esc(t.eventId) + '" ' +
                'aria-label="Select ' + esc(t.label) + '"></td>' +
              '<td data-label="Date">' + esc(t.date || '') + '</td>' +
              '<td data-label="Day">' + esc(t.day || '') + '</td>' +
              '<td data-label="Time">' + esc(t.time || 'TBD') + '</td>' +
              '<td data-label="Grade">' + esc(t.label) + '</td>' +
              '<td data-label="Notes">' + esc(t.notes || '') + '</td>' +
              '<td data-label="Location">' + esc(shortLoc(t.location)) + '</td>' +
            '</tr>';
          }).join('') +
        '</tbody></table></div>' +
        '<div class="confirmbar">' +
          '<button class="primary" id="confirmBtn" disabled>Confirm</button>' +
          '<span id="pickCount" class="meta"></span>' +
        '</div>';
      updatePicked();
    }
  }

  // A signup or release answers with the refreshed page, so it is drawn
  // straight from the reply. Only an older script without that falls
  // back to asking again.
  function redraw(r) {
    if (r && r.page) { saveCache(r.page); render(r.page); }
    else load();
  }

  function setBusy(on) {
    busy = on;
    var bs = document.querySelectorAll('button, table.open input');
    for (var i = 0; i < bs.length; i++) bs[i].disabled = on;
  }

  function pickedIds() {
    var boxes = document.querySelectorAll('table.open input[type=checkbox]');
    var ids = [];
    for (var i = 0; i < boxes.length; i++) {
      var row = boxes[i].closest('tr');
      if (row) row.className = boxes[i].checked ? 'picked' : '';
      if (boxes[i].checked) ids.push(boxes[i].value);
    }
    return ids;
  }

  function updatePicked() {
    var n = pickedIds().length;
    var btn = document.getElementById('confirmBtn');
    if (btn) btn.disabled = busy || n === 0;
    var c = document.getElementById('pickCount');
    if (c) c.textContent = n ? n + ' selected' : 'Select the talks that you can cover, then Confirm.';
  }

  function confirmPicked() {
    if (busy) return;
    var ids = pickedIds();
    if (!ids.length) return;
    var payload = { action: 'claimMany', t: TOKEN, eventIds: ids };
    if (GENERAL) {
      var nm = document.getElementById('pickName').value;
      var em = document.getElementById('pickEmail').value.trim();
      if (!nm || !em) { show('Please choose your name and enter your email.', false); return; }
      payload = { action: 'claimByName', name: nm, email: em, eventIds: ids };
    }
    clearMsg();
    setBusy(true);
    api('POST', payload)
      .then(function (r) {
        setBusy(false);
        var done = parseInt(r.claimed || '0', 10);
        var lines = [];
        if (done) {
          lines.push('Thank you - your name is down for ' + done + ' talk' +
            (done === 1 ? '' : 's') + '. ' + RELEASE_CONTACT + ' confirms the ' +
            'facilitators, so please hold the date' + (done === 1 ? '' : 's') +
            ' until you hear back.');
        }
        if (r.errors && r.errors.length) {
          lines.push((done ? 'Not signed up:\n' : '') + r.errors.join('\n'));
        } else if (!done && r.error) {
          lines.push(r.error);
        }
        show(lines.join('\n\n'), done > 0 && !(r.errors && r.errors.length));
        if (GENERAL) loadGeneral(); else redraw(r);
      })
      .catch(function (e) { setBusy(false); updatePicked(); show('Failed: ' + e.message, false); });
  }

  // One listener for every button, so event IDs never need quoting
  // inside onclick attributes.
  document.addEventListener('click', function (ev) {
    if (!ev.target.closest) return;
    var b = ev.target.closest('button');
    if (b) {
      if (!b.disabled && b.id === 'confirmBtn') confirmPicked();
      return;
    }
    // A click anywhere on a row ticks its box, which is easier on a phone.
    var row = ev.target.closest('table.open tbody tr');
    if (!row) return;
    var box = row.querySelector('input[type=checkbox]');
    if (!box || box.disabled) return;
    if (ev.target !== box) box.checked = !box.checked;
    updatePicked();
  });

  // ---- General link: open talks + name/email, no assignments ----
  function loadGeneral() {
    document.getElementById('welcome').textContent = GENERAL_WELCOME;
    document.getElementById('mineSection').style.display = 'none';
    document.getElementById('picker').style.display = 'block';
    var sel = document.getElementById('pickName');
    var keep = sel.value;
    fetch(API_URL + (API_URL.indexOf('?') === -1 ? '?' : '&') + 'action=names&_=' + Date.now(),
          { credentials: 'omit', redirect: 'follow', cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('the server returned ' + r.status); return r.json(); })
      .then(function (d) {
        doneLoading();
        if (!d || d.ok !== 'true') throw new Error((d && d.error) || 'unknown error');
        if (d.title) { document.getElementById('title').textContent = d.title; document.title = d.title; }
        if (d.intro) document.getElementById('intro').textContent = d.intro;
        if (d.welcome) document.getElementById('welcome').textContent = d.welcome;
        if (d.releaseContact) RELEASE_CONTACT = d.releaseContact;
        sel.innerHTML = '<option value="">Choose your name...</option>' +
          d.names.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
        if (keep) sel.value = keep;
        document.getElementById('main').style.display = 'block';
        renderOpen(d.open || []);
      })
      .catch(function (e) { doneLoading(); show('Could not load: ' + e.message, false); });
  }

  if (GENERAL) {
    loadGeneral();
  } else {
    var cached = readCache();
    if (cached) { render(cached); showChecking(); }
    load();
  }
</script>
</body>
</html>
